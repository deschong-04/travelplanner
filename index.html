<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Travel Planner</title>
    
    <!-- PWA primary configuration -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    
    <!-- Apple home-screen web-clip and standalone behavior settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Travel Planner" />
    <!-- Standard Home Screen Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- For iPhone SE, Older iPhones, and iPads (152x152) -->
    <link rel="apple-touch-icon" sizes="152x152" href="/touch-icon-ipad.png" />
    <!-- For Modern iPhones (167x167 / 180x180) -->
    <link rel="apple-touch-icon" sizes="167x167" href="/touch-icon-ipad-pro.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
